config_version = 2

[accessibility]
ui_scale = 0.80000000447034836

[bar]
order = [ "default" ]

    [bar.default]
    capsule_thickness = 0.99999998137354851
    center = [ "weather", "date", "clock" ]
    end = [ "group:g1", "volume", "battery", "session", "dot-notify" ]
    padding = 10
    scale = 0.80000000447034836
    start = [ "nix-monitor", "keyboard_layout", "workspaces", "taskbar", "active_window" ]
    thickness = 20

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "temp", "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headset_dev_80_99_E7_72_4D_75"]
warning_threshold = 44

[calendar]
enabled = true

[control_center]
hidden_tabs = [ "calendar" ]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    # Dot Clock plugin (home/modules/dot-clock-widget); cx/cy is the widget center in pixels
    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 260.0
    box_width = 640.0
    cx = 1166.0
    cy = 330.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "vladyslav/dot-clock:clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background_opacity = 0.0
        pitch = 14.0
        show_date = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Lausanne, Suisse"
auto_locate = true

[lockscreen]
allow_empty_password = true
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000006"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 681.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    # Dot Clock plugin on the eDP-1 lock screen
    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 260.0
    box_width = 640.0
    cx = 960.0
    cy = 300.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "vladyslav/dot-clock:clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        background_opacity = 0.0
        pitch = 14.0
        show_date = true

    # Dot Clock plugin on the HDMI-A-1 lock screen
    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 260.0
    box_width = 640.0
    cx = 960.0
    cy = 280.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "vladyslav/dot-clock:clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        background_opacity = 0.0
        pitch = 14.0
        show_date = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 112.0
    cx = 640.0
    cy = 480.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        color = "tertiary"
        shadow = true

[notification]
scale = 0.85000000521540642

[osd.kinds]
keyboard_layout = false
lock_keys = false
media = false
nightlight = false

[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "sudo nixos-rebuild switch --flake ~/.config/nixos --upgrade"

[plugins]
enabled = [ "avivbintangaringga/nix-monitor", "yocraft/web-launcher", "cleboost/zed-provider" ]

[shell]
avatar_path = "/home/vladyslav/Downloads/14.png"

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    provider_prefix = "!"

        [shell.launcher.providers.calculator]
        prefix = "cal"

        [shell.launcher.providers.emoji]
        global = false

    [shell.panel]
    control_center_position = "top_center"
    launcher_placement = "attached"
    open_near_click_session = true

[theme]
builtin = "Ayu"
community_palette = "GitHub Dark"
custom_palette = "11-fs"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "hyprland", "kitty" ]
    community_ids = [ "obsidian", "zed", "vicinae", "opencode" ]

[wallpaper]
directory = "/home/vladyslav/.config/nixos/home/Wallpapers"

    [wallpaper.default]
    path = "/home/vladyslav/.config/nixos/home/Wallpapers/14.png"

    [wallpaper.last]
    path = "/home/vladyslav/.config/nixos/home/Wallpapers/14.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/vladyslav/.config/nixos/home/Wallpapers/14.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/vladyslav/.config/nixos/home/Wallpapers/14.png"

[widget.active_window]
display = "icon_only"
enabled = false
interactive = false

[widget.bluetooth]
enabled = false

[widget.cpu]
capsule = true

[widget.network]
show_label = false

[widget.nix-monitor]
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.ram]
capsule = true

[widget.screenshot]
capsule = true

[widget.session]
enabled = false

[widget.sysmon]
capsule = true

[widget.taskbar]
capsule_radius = "auto"
focused_color = "tertiary"
group_by_workspace = true
hide_empty_workspaces = true

# Red dot with the unseen count, from home/modules/dot-notify
[widget.dot-notify]
type = "vladyslav/dot-notify:dot"

[widget.weather]
color = "tertiary"
show_condition = false

[widget.workspaces]
enabled = false
