<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Filled dot crossed by a line from the top right to the bottom left; the dot is cut
       around the line so both stay readable at bar size. -->
  <defs>
    <mask id="cut">
      <rect width="24" height="24" fill="white"/>
      <line x1="20" y1="4" x2="4" y2="20" stroke="black" stroke-width="5" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="12" cy="12" r="6" fill="#ffffff" mask="url(#cut)"/>
  <line x1="20" y1="4" x2="4" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
